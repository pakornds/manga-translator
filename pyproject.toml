[project]
name = "manga-translator"
version = "0.1.0"
description = "Translates Japanese manga pages into Thai with MangaLMM and a fine-tuned Qwen3 model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.66.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "pdf2image>=1.17.0",
    "pillow>=12.1.1",
    "pythainlp>=5.3.0",
    "qwen-vl-utils>=0.0.14",
    "requests>=2.32.5",
    "streamlit>=1.55.0",
    "tqdm>=4.67.3",
]
